spring:
  datasource:
    url: jdbc:h2:mem:gamecatarellibarber;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: INFO

app:
  uploads:
    dir: ./uploads
  auth:
    users:
      cantarelli: cantarelli@2026
      barber: barber@2026
    roles:
      cantarelli: ADMIN
      barber: BARBER

